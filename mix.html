<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Mix - Image Maker</title>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<header>
			<h1>Mix — Quick Image Editor</h1>
			<p class="dev">Developer: Assem bakr</p>
		</header>

		<main class="container">
			<section class="uploader">
				<input id="fileInput" type="file" accept="image/*" />
				<div class="controls">
					<label>Preset:
						<select id="presetSelect">
							<option value="none">None</option>
							<option value="vivid">Vivid</option>
							<option value="mono">Monochrome</option>
							<option value="warm">Warm</option>
							<option value="cool">Cool</option>
						</select>
					</label>
					<label>Brightness <input id="brightness" type="range" min="0.2" max="2" step="0.01" value="1" /></label>
					<label>Contrast <input id="contrast" type="range" min="0.2" max="2" step="0.01" value="1" /></label>
					<label>Saturation <input id="saturate" type="range" min="0" max="3" step="0.01" value="1" /></label>
				</div>

				<div class="ai-options">
					<label>AI Endpoint (optional): <input id="apiUrl" placeholder="https://example.com/edit" /></label>
					<label>API Key (optional): <input id="apiKey" placeholder="Paste API key" /></label>
					<button id="aiBtn">Apply AI Edit</button>
				</div>

				<div class="actions">
					<button id="downloadBtn">Download Edited Image</button>
				</div>
			</section>

			<section class="preview">
				<canvas id="canvas"></canvas>
			</section>
		</main>

		<footer>
			<small>Built with HTML, CSS, and JavaScript — client-side edits + optional AI.</small>
		</footer>

		<script src="app.js"></script>
	</body>
</html>
